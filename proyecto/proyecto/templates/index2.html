<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/styles.css">
    <title>Formulario y Gráficos</title>
</head>
<body>
    <h1>Formulario de Datos</h1>
    <form method="POST" action="/">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required><br>

        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad" required><br>

        <label for="sexo">Sexo:</label>
        <select id="sexo" name="sexo" required>
            <option value="Masculino">Masculino</option>
            <option value="Femenino">Femenino</option>
        </select><br>

        <button type="submit">Enviar Datos</button>
    </form>

    <h2>Gráficos Generados</h2>
    <h3>Distribución de Edades</h3>
    <img src="{{ url_for('plot_png') }}" alt="Gráfico de Barras">
    <h3>Distribución por Sexo</h3>
    <img src="{{ url_for('plot2_png') }}" alt="Gráfico de Barras">
</body>
</html>
